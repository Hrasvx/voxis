[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxis3d"
version = "1.1.0"
description = "Open-source audio-reactive 3D acoustic network visualization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hrasvx" },
]
keywords = [
  "audio-visualization",
  "spectral-analysis",
  "3d",
  "opengl",
  "birdsongs",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "PySide6>=6.7,<7",
  "av>=12,<19",
  "moderngl>=5.10,<6",
  "glcontext>=2.3,<4",
  "numpy>=1.26,<3",
]

[project.urls]
Homepage = "https://github.com/Hrasvx/voxis"
Repository = "https://github.com/Hrasvx/voxis"
"Bug Tracker" = "https://github.com/Hrasvx/voxis/issues"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
voxis = "voxis.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxis = [
  "visualization/shaders/*.vert",
  "visualization/shaders/*.geom",
  "visualization/shaders/*.frag",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
